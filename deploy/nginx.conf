# Reverse proxy: aurafit-backend (Node on 127.0.0.1:8080) -> public HTTPS.
# Place at /etc/nginx/sites-available/aurafit-backend and symlink into sites-enabled.
# Run `sudo certbot --nginx -d api.yourdomain.com` afterwards to provision TLS
# (certbot will rewrite this file to add the SSL server block automatically).

server {
    listen 80;
    server_name api.yourdomain.com;

    location / {
        proxy_pass http://127.0.0.1:8081;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
